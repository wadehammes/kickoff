name: create-release
on:
  push:
    tags:
      - "v*"
# `make release` tags origin/main; this workflow builds, publishes that commit to npm, and creates the GitHub release.
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: GitHub's OIDC token authenticates `npm publish`, so no npm token is stored.
      id-token: write
    steps:
      - name: Check the tag is a release version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like vX.Y.Z; it becomes the npm version and the GitHub release name."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main. Release with make release, which tags origin/main."
            exit 1
          fi
      - name: Setup PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: package.json
      - name: Read Node.js version from .tool-versions
        id: get_node_version
        shell: bash
        run: |
          echo "node_version=$(awk '/nodejs/ {print $2}' .tool-versions)" >> $GITHUB_OUTPUT
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ steps.get_node_version.outputs.node_version }}
          registry-url: https://registry.npmjs.org
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test
        run: pnpm build && pnpm test
      - name: Set the package version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Check the package installs and runs
        run: bash scripts/verify-package.sh
      # The npm that ships with Node doesn't have `npm stage` yet. Pin one that does,
      # at least 7 days old like every other package here.
      - name: Install an npm with staged publishing
        run: |
          npm install -g npm@11.21.3
          npm stage --help >/dev/null
      # The trusted publisher only allows staging. A maintainer approves the staged
      # version with 2FA (`npm stage approve`), and that is what publishes it.
      - name: Stage on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${GITHUB_REF_NAME#v}"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; skipping to the GitHub release."
          elif ! output="$(npm stage publish 2>&1)"; then
            echo "${output}"
            if grep -qi "already" <<<"${output}"; then
              echo "${name}@${version} is already staged (an earlier run staged it); skipping to the GitHub release."
            else
              exit 1
            fi
          else
            echo "${output}"
          fi
          {
            echo "### Approve ${name}@${version}"
            echo
            echo "The version is staged, not public. Approve it with 2FA to publish it:"
            echo
            echo '```sh'
            echo "npm stage list ${name}"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@0440d0932f9a0dd1cc9ecd8412830761351323bd # v4.7.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
      # npm only gets the version once a maintainer approves it, so this checks the
      # GitHub release; scripts/watch-release.sh checks npm after approval.
      - name: Check the GitHub release matches the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$release" != "$GITHUB_REF_NAME" ]; then
            echo "::error::GitHub has ${release:-no release} for tag $GITHUB_REF_NAME."
            exit 1
          fi
          echo "GitHub release ${release} matches. Approve the staged npm version to publish it."
