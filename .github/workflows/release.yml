name: create-release
on:
  push:
    tags:
      - "v*"
# Only this workflow should update main: `make release` tags staging, and Reset Main fast-forwards main to the tag.
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: GitHub's OIDC token authenticates `npm publish`, so no npm token is stored.
      id-token: write
    steps:
      - name: Check the tag is a release version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like vX.Y.Z; it becomes the npm version and the GitHub release name."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # The default checkout persists GITHUB_TOKEN as git HTTP auth, which would override the PAT below and push as github-actions[bot] (no ruleset bypass).
          persist-credentials: false
      - name: Setup PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: package.json
      - name: Read Node.js version from .tool-versions
        id: get_node_version
        shell: bash
        run: |
          echo "node_version=$(awk '/nodejs/ {print $2}' .tool-versions)" >> $GITHUB_OUTPUT
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ steps.get_node_version.outputs.node_version }}
          registry-url: https://registry.npmjs.org
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test
        run: pnpm build && pnpm test
      - name: Set the package version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Check the package installs and runs
        run: bash scripts/verify-package.sh
      - name: Reset Main
        id: reset_main
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "$RELEASE_PUSH_TOKEN" ]; then
            echo "::error::Add repository secret RELEASE_PUSH_TOKEN (PAT with Contents read/write; owner allowed to bypass the main ruleset)."
            exit 1
          fi
          git config --global --unset-all "http.https://github.com/.extraheader" || true
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git remote set-url origin "https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "${{ github.ref }}:main"
      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${GITHUB_REF_NAME#v}"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm (an earlier run published it); skipping to the GitHub release."
          else
            npm publish
          fi
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@0440d0932f9a0dd1cc9ecd8412830761351323bd # v4.7.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check npm and the GitHub release match the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${GITHUB_REF_NAME#v}"
          published=""
          for attempt in $(seq 1 12); do
            published="$(npm view "${name}@${version}" version 2>/dev/null || true)"
            [ -n "$published" ] && break
            sleep 5
          done
          release="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$published" != "$version" ] || [ "$release" != "$GITHUB_REF_NAME" ]; then
            echo "::error::npm has ${published:-nothing} and GitHub has ${release:-no release} for tag $GITHUB_REF_NAME."
            exit 1
          fi
          echo "npm ${name}@${published} and GitHub release ${release} match."
